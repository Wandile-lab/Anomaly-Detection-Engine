services:
  nginx:
    image: nginx:latest
    container_name: hng-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    depends_on:
      - nextcloud

  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: hng-nextcloud
    expose:
      - "80"
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro

volumes:
  HNG-nginx-logs:
